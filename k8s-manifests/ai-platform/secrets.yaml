# ============================================================================
# AI Platform Secrets
# IMPORTANT: Replace placeholder values before applying.
#   kubectl create secret generic ai-platform-secrets \
#     --namespace=ai-platform \
#     --from-literal=qdrant-api-key=YOUR_QDRANT_KEY \
#     --from-literal=rds-password=YOUR_RDS_PASSWORD
# Or apply this file after base64-encoding your values:
#   echo -n 'YOUR_VALUE' | base64
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ai-platform-secrets
  namespace: ai-platform
  labels:
    app: ai-platform
type: Opaque
data:
  # base64-encoded values — replace before applying
  qdrant-api-key: REPLACE_WITH_BASE64_ENCODED_VALUE
  rds-password: REPLACE_WITH_BASE64_ENCODED_VALUE

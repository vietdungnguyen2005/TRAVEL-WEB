# ============================================================================
# ServiceAccount with IAM Role (IRSA) — grants pods Bedrock access
# Replace ACCOUNT_ID and CLUSTER_NAME after Terraform apply.
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent-sa
  namespace: ai-platform
  labels:
    app: ai-platform
    component: backend
  annotations:
    # EKS IRSA — link to the IAM role created by Terraform (bedrock.tf)
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/ai-agent-bedrock-role"

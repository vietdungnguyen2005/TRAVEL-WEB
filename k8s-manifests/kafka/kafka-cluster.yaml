# ============================================================================
# Strimzi Kafka Operator — Quản lý Kafka trên Kubernetes
# ============================================================================
# Strimzi CRD cho phép khai báo Kafka cluster bằng YAML thay vì cấu hình thủ công.
# Operator sẽ tự động tạo Zookeeper, Broker, và quản lý lifecycle.
# ============================================================================
# Cài đặt Strimzi Operator bằng Helm (chạy 1 lần):
#   helm repo add strimzi https://strimzi.io/charts/
#   helm repo update
#   helm install strimzi-operator strimzi/strimzi-kafka-operator \
#     --namespace kafka \
#     --version 0.43.0 \
#     --wait
# ============================================================================

apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: ai-platform-kafka
  namespace: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: data-pipeline
spec:
  kafka:
    version: 3.7.0
    replicas: 1 # Single broker — tiết kiệm cho dev, tăng lên 3 cho prod
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      # Replication — phù hợp với single broker
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1

      # Performance
      num.partitions: 3
      log.retention.hours: 168 # 7 ngày
      log.segment.bytes: 1073741824 # 1GB per segment
      log.retention.check.interval.ms: 300000

      # Cleanup
      log.cleanup.policy: delete
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 10Gi
          deleteClaim: true # Xóa PVC khi xóa cluster (dev-friendly)
          class: gp2
    resources:
      requests:
        memory: 1Gi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: "1"

  # --- Zookeeper (sẽ bị thay bằng KRaft trong Kafka 4.0) ---
  zookeeper:
    replicas: 1 # Single node cho dev
    storage:
      type: persistent-claim
      size: 5Gi
      deleteClaim: true
      class: gp2
    resources:
      requests:
        memory: 512Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 500m

  # --- Entity Operator: quản lý Topics và Users ---
  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: 50m
        limits:
          memory: 512Mi
          cpu: 250m
    userOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: 50m
        limits:
          memory: 512Mi
          cpu: 250m

---
# ============================================================================
# Kafka Topics — Kênh dữ liệu cho pipeline
# ============================================================================

apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: app-logs
  namespace: kafka
  labels:
    strimzi.io/cluster: ai-platform-kafka
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000   # 7 ngày
    cleanup.policy: delete
    segment.bytes: 104857600  # 100MB
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: otel-traces
  namespace: kafka
  labels:
    strimzi.io/cluster: ai-platform-kafka
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 259200000   # 3 ngày
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: otel-metrics
  namespace: kafka
  labels:
    strimzi.io/cluster: ai-platform-kafka
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 259200000   # 3 ngày
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: processed-events
  namespace: kafka
  labels:
    strimzi.io/cluster: ai-platform-kafka
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000   # 7 ngày
    cleanup.policy: compact

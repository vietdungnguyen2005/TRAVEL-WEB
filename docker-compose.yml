version: "3.8"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - backend-network
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: prometheus
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - backend-network

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    ports:
      - "3007:3000"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - prometheus
    networks:
      - backend-network

  # Simple shared DB viewer for the team (connect to auth-db/booking-db/...)
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      - auth-db
      - booking-db
      - room-db
      - payment-db
      - review-db
      - notification-db
    networks:
      - backend-network

  consul:
    image: hashicorp/consul:1.16.0
    container_name: consul
    command: ["agent", "-dev", "-client=0.0.0.0"]
    ports:
      - "8500:8500"
    networks:
      - backend-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-db:
    image: postgres:15
    container_name: auth-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: auth_db
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  booking-db:
    image: postgres:15
    container_name: booking-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: booking_db
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  room-db:
    image: postgres:15
    container_name: room-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: room_db
    volumes:
      - room-db-data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:15
    container_name: payment-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: payment_db
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  review-db:
    image: postgres:15
    container_name: review-db
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: review_db
    volumes:
      - review-db-data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:15
    container_name: notification-db
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: notification_db
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  blog-db:
    image: postgres:15
    container_name: blog-db
    ports:
      - "5438:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: blog_db
    volumes:
      - blog-db-data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - backend-network

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    ports:
      - "3001:3001"
    depends_on:
      - auth-db
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@auth-db:5432/auth_db
    networks:
      - backend-network

  booking-service:
    build: ./services/booking-service
    expose:
      - "3002"
    depends_on:
      booking-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - PORT=3002
      - JWT_SECRET=${JWT_SECRET}
      - BOOKING_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@booking-db:5432/booking_db
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:'+process.env.PORT+'/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      replicas: 2

  room-service:
    build: ./services/room-service
    container_name: room-service
    ports:
      - "3003:3003"
    depends_on:
      - room-db
      - rabbitmq
    environment:
      - PORT=3003
      - JWT_SECRET=${JWT_SECRET}
      - ROOM_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@room-db:5432/room_db
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    networks:
      - backend-network

  payment-service:
    build: ./services/payment-service
    expose:
      - "3004"
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - PORT=3004
      - JWT_SECRET=${JWT_SECRET}
      - PAYMENT_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@payment-db:5432/payment_db
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:'+process.env.PORT+'/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      replicas: 2

  review-service:
    build: ./services/review-service
    container_name: review-service
    ports:
      - "3005:3005"
    depends_on:
      - review-db
    environment:
      - PORT=3005
      - REVIEW_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@review-db:5432/review_db
    networks:
      - backend-network

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    ports:
      - "3006:3006"
    depends_on:
      - rabbitmq
      - notification-db
      - redis
    environment:
      - PORT=3006
      - EMAIL_FROM=
      - SENDGRID_API_KEY=
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      - NOTIFICATION_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@notification-db:5432/notification_db
      - REDIS_URL=redis://redis:6379
    networks:
      - backend-network

  blog-service:
    build:
      context: .
      dockerfile: services/blog-service/Dockerfile
    container_name: blog-service
    ports:
      - "3008:3008"
    depends_on:
      - blog-db
    environment:
      - PORT=3008
      - JWT_SECRET=${JWT_SECRET}
      - BLOG_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@blog-db:5432/blog_db
    networks:
      - backend-network

  api-gateway:
    build: ./services/api-gateway
    expose:
      - "4000"
    depends_on:
      auth-service:
        condition: service_started
      booking-service:
        condition: service_healthy
      room-service:
        condition: service_started
      payment-service:
        condition: service_healthy
      review-service:
        condition: service_started
      notification-service:
        condition: service_started
      blog-service:
        condition: service_started
      consul:
        condition: service_started
      redis:
        condition: service_started
    environment:
      PORT: 4000
      TRUST_PROXY: "1"
      REDIS_URL: ${REDIS_URL}
      AUTH_SERVICE_URL: http://auth-service:3001
      BOOKING_SERVICE_URL: http://booking-service:3002
      ROOM_SERVICE_URL: http://room-service:3003
      PAYMENT_SERVICE_URL: http://payment-service:3004
      REVIEW_SERVICE_URL: http://review-service:3005
      BLOG_SERVICE_URL: http://blog-service:3008
      SERVICE_DISCOVERY_MODE: ${SERVICE_DISCOVERY_MODE:-static}
      CONSUL_URL: http://consul:8500
      DISCOVERY_REFRESH_MS: 10000
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:'+(process.env.PORT||4000)+'/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      replicas: 2

  # Scheduled mirror: pull Supabase schemas into local docker Postgres for easy team viewing.
  # This is best-effort and intended for dev/debug, not production-grade replication.
  supabase-docker-sync:
    image: postgres:15
    container_name: supabase-docker-sync
    depends_on:
      - auth-db
      - booking-db
      - room-db
      - payment-db
      - review-db
      - notification-db
      - blog-db
    volumes:
      - ./infra/replication:/replication:ro
    environment:
      # Optional: sync subset, e.g. "auth,booking"
      SYNC_SERVICES: ${SYNC_SERVICES:-}
      # Interval seconds (default 300 = 5 minutes)
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
    entrypoint: ["/bin/bash", "-lc"]
    command: |
      chmod +x /replication/supabase-to-docker.sh && \
      echo "[supabase-docker-sync] interval=${SYNC_INTERVAL_SECONDS}s" && \
      while true; do \
        set -a && \
        if [ -f /replication/supabase.env ]; then . /replication/supabase.env; fi && \
        set +a && \
        /replication/supabase-to-docker.sh || echo "[supabase-docker-sync] sync failed"; \
        sleep "${SYNC_INTERVAL_SECONDS}"; \
      done
    networks:
      - backend-network

volumes:
  auth-db-data:
  booking-db-data:
  room-db-data:
  payment-db-data:
  review-db-data:
  notification-db-data:
  blog-db-data:
  pgadmin-data:

networks:
  backend-network:

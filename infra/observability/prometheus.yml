global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:4000"]

  - job_name: booking-service
    metrics_path: /metrics
    static_configs:
      - targets: ["booking-service:3002"]
